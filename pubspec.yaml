name: iq_navigator_fee_submission
description: "IQ Navigator Fee Submission"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  responsive_sizer: ^3.3.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  equatable: ^2.0.7
  intl: ^0.20.2
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/applogo.jpeg
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/applogo.jpeg
  web:
    generate: true
    image_path: assets/applogo.jpeg
    background_color: "#FFFFFF"
    theme_color: "#6C4DFF"

flutter:
  uses-material-design: true
  assets:
    - assets/applogo.jpeg
